[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "med-researcher-agent"
version = "0.1.0"
description = "Reusable medical research agent configuration for Claude Code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pypdf>=5.0"]

[project.scripts]
med-db = "entrypoints:med_db"
med-db-lookup = "entrypoints:med_db_lookup"
med-db-query = "entrypoints:med_db_query"
med-db-lookup-icd11 = "entrypoints:med_db_lookup_icd11"
med-db-lookup-dsm5 = "entrypoints:med_db_lookup_dsm5"
med-db-download-icd11 = "entrypoints:med_db_download_icd11"
med-db-download-paper = "entrypoints:med_db_download_paper"
med-db-setup-dsm5 = "entrypoints:med_db_setup_dsm5"
med-db-setup-therapy-methods = "entrypoints:med_db_setup_therapy_methods"
med-db-integrity-check = "entrypoints:med_db_integrity_check"
med-db-term = "entrypoints:med_db_term"
med-db-term-lookup = "entrypoints:med_db_term_lookup"
med-db-term-wikipedia = "entrypoints:med_db_term_wikipedia"
med-db-term-mesh = "entrypoints:med_db_term_mesh"
check-retraction = "entrypoints:check_retraction"
csv-util = "entrypoints:csv_util"
session-protocol = "entrypoints:session_protocol"
lint-md = "entrypoints:lint_md"
test = "entrypoints:test"
lint = "entrypoints:lint"
format = "entrypoints:format"
fetch-archive = "entrypoints:fetch_archive"

[tool.setuptools]
py-modules = ["entrypoints"]

[tool.setuptools.package-dir]
"" = ".claude/scripts"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pre-commit>=4.6.2",
    "pytest>=9.0.3",
    "ruff>=0.16.8",
    "rumdl>=0.2.79",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "N", "C4", "RUF"]
# Intentional typography in help text, docstrings, and HTML-entity maps.
allowed-confusables = ["–", "—", "’", "‘", "×", " "]
